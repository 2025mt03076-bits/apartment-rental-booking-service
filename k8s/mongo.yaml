apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-mongo
  template:
    metadata:
      labels:
        app: booking-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}   # demo only: data is lost if the pod restarts
---
apiVersion: v1
kind: Service
metadata:
  name: booking-mongo
spec:
  selector:
    app: booking-mongo
  ports:
    - port: 27017
      targetPort: 27017
