apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
data:
  MONGO_URI: "mongodb://booking-mongo:27017/bookingdb"
  # Kubernetes DNS name of the Listing Service's Service object
  LISTING_SERVICE_URL: "http://listing-service:3001"
  PORT: "3002"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: booking-service:1.0
          imagePullPolicy: Never   # image is built inside minikube's Docker daemon
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: booking-service-config
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  type: NodePort
  selector:
    app: booking-service
  ports:
    - port: 3002
      targetPort: 3002
      nodePort: 30002
